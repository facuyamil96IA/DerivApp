<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Extractor Universal de Ticks Deriv (Multi-Servidor Automático)</title>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/pako/2.1.0/pako.min.js"></script>
  <style>
    * { box-sizing: border-box; }
    body {
      background: #090d16;
      color: #f1f5f9;
      font-family: system-ui, -apple-system, sans-serif;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      margin: 0;
      padding: 16px;
    }
    .card {
      background: #1e293b;
      padding: 24px;
      border-radius: 12px;
      width: 100%;
      max-width: 580px;
      box-shadow: 0 10px 30px rgba(0,0,0,0.6);
      border: 1px solid #334155;
    }
    h2 { margin: 0 0 6px 0; color: #38bdf8; font-size: 1.25rem; }
    p { color: #94a3b8; font-size: 0.82rem; margin: 0 0 14px 0; }
    
    .status-badge-container {
      display: flex;
      flex-wrap: wrap;
      gap: 6px;
      margin-bottom: 14px;
    }
    .badge {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      background: #064e3b;
      color: #34d399;
      font-size: 0.72rem;
      padding: 3px 8px;
      border-radius: 4px;
      font-family: monospace;
    }
    .badge-scan {
      background: #451a03;
      color: #f59e0b;
    }
    .dot {
      width: 6px;
      height: 6px;
      border-radius: 50%;
      background: #34d399;
    }
    .dot.busy { background: #f59e0b; animation: pulse 1s infinite; }
    @keyframes pulse { 0%, 100% { opacity: 1; } 50% { opacity: 0.3; } }

    .grid-3 {
      display: grid;
      grid-template-columns: 2fr 1fr 1fr;
      gap: 10px;
      margin-bottom: 14px;
    }
    @media (max-width: 520px) {
      .grid-3 { grid-template-columns: 1fr; }
    }
    label {
      display: block;
      font-size: 0.76rem;
      color: #cbd5e1;
      margin-bottom: 5px;
      font-weight: 600;
    }
    select, input[type="text"], input[type="number"] {
      width: 100%;
      background: #0f172a;
      border: 1px solid #334155;
      padding: 9px 10px;
      border-radius: 6px;
      color: #fff;
      font-size: 0.85rem;
      font-family: monospace;
    }
    select:focus, input:focus { outline: none; border-color: #38bdf8; }

    .options-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 10px;
      margin-bottom: 16px;
    }
    .opt-card {
      background: #0f172a;
      border: 1px solid #334155;
      padding: 10px;
      border-radius: 8px;
      font-size: 0.82rem;
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 8px;
    }
    .opt-card input { cursor: pointer; }

    .btn-row {
      display: flex;
      gap: 10px;
      margin-top: 6px;
    }
    button {
      flex: 1;
      background: #2563eb;
      color: white;
      border: none;
      padding: 12px;
      border-radius: 6px;
      font-size: 0.95rem;
      font-weight: 600;
      cursor: pointer;
      transition: background 0.2s;
    }
    button:hover { background: #1d4ed8; }
    button:disabled { background: #475569; cursor: not-allowed; }
    .btn-stop { background: #dc2626; }
    .btn-stop:hover { background: #b91c1c; }

    .progress-box {
      margin: 16px 0 6px 0;
      background: #0f172a;
      border-radius: 6px;
      height: 12px;
      overflow: hidden;
      border: 1px solid #334155;
    }
    .progress-bar { height: 100%; width: 0%; background: #38bdf8; transition: width 0.15s ease; }
    
    .stats-row {
      display: flex;
      justify-content: space-between;
      font-size: 0.78rem;
      color: #94a3b8;
      font-family: monospace;
      margin-bottom: 12px;
    }
    #console {
      background: #020617;
      border: 1px solid #334155;
      border-radius: 6px;
      padding: 12px;
      font-family: monospace;
      font-size: 0.74rem;
      height: 175px;
      overflow-y: auto;
      color: #a5f3fc;
    }
  </style>
</head>
<body>

<div class="card">
  <h2>Extractor Universal de Ticks Deriv</h2>
  <p>Escáner dinámico multi-servidor con conmutación automática por fallo.</p>

  <div class="status-badge-container">
    <span id="serverBadge" class="badge">
      <span id="serverDot" class="dot"></span>
      <span id="serverText">Modo: Auto-Detección de Servidores</span>
    </span>
  </div>

  <div class="grid-3">
    <div>
      <label for="assetSelect">Activo a extraer:</label>
      <select id="assetSelect" onchange="checkCustomAsset(this.value)">
        <optgroup label="Sintéticos Volatility (1s)">
          <option value="1HZ75V" selected>1HZ75V (Volatility 75 1s)</option>
          <option value="1HZ10V">1HZ10V (Volatility 10 1s)</option>
          <option value="1HZ25V">1HZ25V (Volatility 25 1s)</option>
          <option value="1HZ50V">1HZ50V (Volatility 50 1s)</option>
          <option value="1HZ100V">1HZ100V (Volatility 100 1s)</option>
          <option value="1HZ150V">1HZ150V (Volatility 150 1s)</option>
          <option value="1HZ250V">1HZ250V (Volatility 250 1s)</option>
        </optgroup>
        <optgroup label="Sintéticos Estándar (2s)">
          <option value="R_75">R_75 (Volatility 75)</option>
          <option value="R_10">R_10 (Volatility 10)</option>
          <option value="R_25">R_25 (Volatility 25)</option>
          <option value="R_50">R_50 (Volatility 50)</option>
          <option value="R_100">R_100 (Volatility 100)</option>
        </optgroup>
        <optgroup label="Crash / Boom">
          <option value="BOOM500">BOOM500</option>
          <option value="BOOM1000">BOOM1000</option>
          <option value="CRASH500">CRASH500</option>
          <option value="CRASH1000">CRASH1000</option>
        </optgroup>
        <option value="CUSTOM">-- Escribir otro símbolo --</option>
      </select>
    </div>

    <div>
      <label for="appIdInput">App ID:</label>
      <input type="text" id="appIdInput" value="1089" placeholder="1089 o el tuyo">
    </div>

    <div>
      <label for="targetCount">Ticks:</label>
      <input type="number" id="targetCount" value="100000" step="5000" min="5000">
    </div>
  </div>

  <div id="customSymbolRow" style="display: none; margin-bottom: 14px;">
    <label for="customSymbolInput">Código exacto del activo:</label>
    <input type="text" id="customSymbolInput" placeholder="Ej: 1HZ200V, STEPINDEX, etc.">
  </div>

  <div class="options-grid">
    <label class="opt-card">
      <input type="radio" name="format" value="csv" checked>
      <span>CSV Plano (.csv)</span>
    </label>
    <label class="opt-card">
      <input type="radio" name="format" value="gz">
      <span>Comprimido (.csv.gz)</span>
    </label>
  </div>

  <div class="btn-row">
    <button id="btnStart" onclick="iniciarExtraccion()">Iniciar Extracción Automática</button>
    <button id="btnStop" class="btn-stop" onclick="detenerExtraccion()" style="display: none;">Detener y Descargar</button>
  </div>

  <div class="progress-box">
    <div id="bar" class="progress-bar"></div>
  </div>

  <div class="stats-row">
    <span id="statCount">Ticks: 0 / 100.000</span>
    <span id="statPct">0%</span>
  </div>

  <div id="console">> Presiona "Iniciar Extracción" para buscar automáticamente el mejor servidor...</div>
</div>

<script>
// Lista de Servidores y Clusters Globales de Deriv
const SERVERS_POOL = [
  { name: 'Servidor Red (4)',    host: 'wss://red.derivws.com/websockets/v3' },
  { name: 'Servidor Oficial WS', host: 'wss://ws.derivws.com/websockets/v3' },
  { name: 'Servidor Blue (2)',   host: 'wss://blue.derivws.com/websockets/v3' },
  { name: 'Servidor Green (3)',  host: 'wss://green.derivws.com/websockets/v3' },
  { name: 'Cluster Directo',     host: 'wss://derivws.com/websockets/v3' },
  { name: 'Gateway Alternativo', host: 'wss://frontend.derivws.com/websockets/v3' }
];

const BATCH_SIZE = 5000;

let currentServerIndex = 0;
let ws = null;
let allTicks = [];
let currentEnd = 'latest';
let isRunning = false;
let selectedSymbol = '1HZ75V';
let targetTicks = 100000;
let appId = '1089';
let isSwitchingServer = false;

function checkCustomAsset(val) {
  document.getElementById('customSymbolRow').style.display = (val === 'CUSTOM') ? 'block' : 'none';
}

function getChosenSymbol() {
  const selectVal = document.getElementById('assetSelect').value;
  return selectVal === 'CUSTOM' ? document.getElementById('customSymbolInput').value.trim().toUpperCase() : selectVal;
}

function log(msg, color = '#a5f3fc') {
  const el = document.getElementById('console');
  const t = new Date().toTimeString().split(' ')[0];
  el.innerHTML += `<div style="color:${color}">[${t}] ${msg}</div>`;
  el.scrollTop = el.scrollHeight;
}

function updateProgress(count) {
  const pct = Math.min(100, Math.round((count / targetTicks) * 100));
  document.getElementById('bar').style.width = pct + '%';
  document.getElementById('statCount').innerText = `Ticks: ${count.toLocaleString()} / ${targetTicks.toLocaleString()}`;
  document.getElementById('statPct').innerText = `${pct}%`;
}

function setServerBadge(text, isBusy = false) {
  const badge = document.getElementById('serverBadge');
  const dot = document.getElementById('serverDot');
  document.getElementById('serverText').innerText = text;
  if (isBusy) {
    badge.className = 'badge badge-scan';
    dot.className = 'dot busy';
  } else {
    badge.className = 'badge';
    dot.className = 'dot';
  }
}

function iniciarExtraccion() {
  if (isRunning) return;

  selectedSymbol = getChosenSymbol();
  if (!selectedSymbol) {
    alert('Ingresa o selecciona un símbolo válido.');
    return;
  }

  appId = document.getElementById('appIdInput').value.trim() || '1089';
  targetTicks = parseInt(document.getElementById('targetCount').value, 10) || 100000;

  if (targetTicks < 5000) {
    alert('La cantidad mínima es de 5.000 ticks.');
    return;
  }

  isRunning = true;
  allTicks = [];
  currentEnd = 'latest';
  currentServerIndex = 0;
  updateProgress(0);

  document.getElementById('btnStart').style.display = 'none';
  document.getElementById('btnStop').style.display = 'block';
  document.getElementById('assetSelect').disabled = true;
  document.getElementById('appIdInput').disabled = true;
  document.getElementById('targetCount').disabled = true;

  log(`Iniciando sondeo multi-servidor para ${selectedSymbol} (${targetTicks.toLocaleString()} ticks)...`, '#38bdf8');
  conectarServidorActual();
}

function conectarServidorActual() {
  if (!isRunning) return;

  const srv = SERVERS_POOL[currentServerIndex];
  const url = `${srv.host}?app_id=${appId}`;
  setServerBadge(`Probando: ${srv.name}...`, true);
  log(`Conectando a [${srv.name}] (${srv.host})...`, '#f59e0b');

  if (ws) {
    try { ws.close(); } catch(e){}
  }

  isSwitchingServer = false;

  // Timeout de seguridad: si no conecta o no responde en 4 segundos, salta al siguiente
  const connectTimeout = setTimeout(() => {
    if (ws && ws.readyState !== WebSocket.OPEN) {
      log(`Timeout de conexión en ${srv.name}. Saltando al siguiente...`, '#ef4444');
      saltarSiguienteServidor();
    }
  }, 4000);

  try {
    ws = new WebSocket(url);
  } catch (e) {
    clearTimeout(connectTimeout);
    saltarSiguienteServidor();
    return;
  }

  ws.onopen = () => {
    clearTimeout(connectTimeout);
    setServerBadge(`Activo: ${srv.name}`);
    log(`✔ Conectado exitosamente con ${srv.name}. Solicitando lote...`, '#4ade80');
    solicitarLote();
  };

  ws.onmessage = (event) => {
    if (!isRunning || isSwitchingServer) return;

    try {
      const data = JSON.parse(event.data);

      if (data.error) {
        log(`[${srv.name}] Error de API: ${data.error.message}`, '#ef4444');
        saltarSiguienteServidor();
        return;
      }

      if (data.msg_type === 'history') {
        const times = data.history.times || [];
        const prices = data.history.prices || [];

        if (!times.length) {
          log('Fin del historial alcanzado en Deriv.', '#facc15');
          finalizar(true);
          return;
        }

        const batch = times.map((t, i) => ({ epoch: t, price: prices[i] }));
        allTicks = batch.concat(allTicks);

        updateProgress(allTicks.length);
        log(`Descargados: ${allTicks.length.toLocaleString()} / ${targetTicks.toLocaleString()} ticks (${srv.name})`);

        if (allTicks.length >= targetTicks) {
          allTicks = allTicks.slice(allTicks.length - targetTicks);
          finalizar(true);
        } else {
          // Retrocedemos un segundo del tick más antiguo descargado
          currentEnd = times[0] - 1;
          setTimeout(solicitarLote, 130);
        }
      }
    } catch (err) {
      console.error(err);
    }
  };

  ws.onerror = () => {
    if (!isSwitchingServer && isRunning) {
      log(`Fallo de red en ${srv.name}.`, '#ef4444');
      saltarSiguienteServidor();
    }
  };

  ws.onclose = () => {
    if (!isSwitchingServer && isRunning && allTicks.length < targetTicks) {
      log(`Enlace cerrado por ${srv.name}.`, '#f87171');
      saltarSiguienteServidor();
    }
  };
}

function saltarSiguienteServidor() {
  if (isSwitchingServer || !isRunning) return;
  isSwitchingServer = true;

  if (ws) {
    try { ws.close(); } catch(e){}
  }

  currentServerIndex = (currentServerIndex + 1) % SERVERS_POOL.length;
  const nextSrv = SERVERS_POOL[currentServerIndex];
  log(`Cambiando automáticamente a ${nextSrv.name}... (Ticks conservados: ${allTicks.length.toLocaleString()})`, '#38bdf8');
  
  setTimeout(() => {
    conectarServidorActual();
  }, 500);
}

function solicitarLote() {
  if (!ws || ws.readyState !== WebSocket.OPEN || !isRunning) return;
  ws.send(JSON.stringify({
    ticks_history: selectedSymbol,
    adjust_start_time: 1,
    count: BATCH_SIZE,
    end: currentEnd,
    style: 'ticks'
  }));
}

function detenerExtraccion() {
  if (!isRunning) return;
  log('Detención manual por el usuario. Guardando datos...', '#f59e0b');
  finalizar(allTicks.length > 0);
}

function finalizar(generarDescarga) {
  isRunning = false;
  document.getElementById('btnStart').style.display = 'block';
  document.getElementById('btnStop').style.display = 'none';
  document.getElementById('assetSelect').disabled = false;
  document.getElementById('appIdInput').disabled = false;
  document.getElementById('targetCount').disabled = false;
  setServerBadge('Modo: Auto-Detección de Servidores');

  if (ws) {
    try { ws.close(); } catch(e){}
  }

  if (generarDescarga && allTicks.length > 0) {
    generarArchivo();
  } else {
    log('Proceso finalizado sin archivo.', '#94a3b8');
  }
}

function generarArchivo() {
  log(`Exportando ${allTicks.length.toLocaleString()} registros de ${selectedSymbol}...`, '#38bdf8');

  let csv = 'epoch,datetime_utc,symbol,price\n';
  for (let i = 0; i < allTicks.length; i++) {
    const t = allTicks[i];
    const iso = new Date(t.epoch * 1000).toISOString();
    csv += `${t.epoch},${iso},${selectedSymbol},${t.price}\n`;
  }

  const formato = document.querySelector('input[name="format"]:checked').value;
  const ts = Date.now();
  const filename = `deriv_${selectedSymbol}_${allTicks.length}k_${ts}`;

  if (formato === 'gz') {
    log('Comprimiendo archivo con Gzip (.csv.gz)...', '#38bdf8');
    const compressed = pako.gzip(csv);
    const blob = new Blob([compressed], { type: 'application/gzip' });
    descargarBlob(blob, `${filename}.csv.gz`);
  } else {
    log('Descargando archivo CSV plano...', '#38bdf8');
    const blob = new Blob([csv], { type: 'text/csv;charset=utf-8;' });
    descargarBlob(blob, `${filename}.csv`);
  }

  log(`✔ Descarga finalizada exitosamente: ${filename}`, '#4ade80');
}

function descargarBlob(blob, filename) {
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url;
  a.download = filename;
  document.body.appendChild(a);
  a.click();
  document.body.removeChild(a);
  URL.revokeObjectURL(url);
}
</script>
</body>
</html>
