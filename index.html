<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Extractor Universal de Ticks Deriv (Estable)</title>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/pako/2.1.0/pako.min.js"></script>
  <style>
    * { box-sizing: border-box; }
    body {
      background: #090d16;
      color: #f1f5f9;
      font-family: system-ui, -apple-system, sans-serif;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      margin: 0;
      padding: 16px;
    }
    .card {
      background: #1e293b;
      padding: 24px;
      border-radius: 12px;
      width: 100%;
      max-width: 580px;
      box-shadow: 0 10px 30px rgba(0,0,0,0.6);
      border: 1px solid #334155;
    }
    h2 { margin: 0 0 6px 0; color: #38bdf8; font-size: 1.25rem; }
    p { color: #94a3b8; font-size: 0.82rem; margin: 0 0 14px 0; }
    
    .badge {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      background: #064e3b;
      color: #34d399;
      font-size: 0.72rem;
      padding: 4px 10px;
      border-radius: 6px;
      font-family: monospace;
      margin-bottom: 14px;
    }
    .badge.busy { background: #451a03; color: #f59e0b; }
    .badge.err { background: #450a0a; color: #f87171; }
    .dot { width: 7px; height: 7px; border-radius: 50%; background: currentColor; }

    .grid-3 {
      display: grid;
      grid-template-columns: 2fr 1fr 1fr;
      gap: 10px;
      margin-bottom: 12px;
    }
    @media (max-width: 520px) { .grid-3 { grid-template-columns: 1fr; } }
    label {
      display: block;
      font-size: 0.76rem;
      color: #cbd5e1;
      margin-bottom: 5px;
      font-weight: 600;
    }
    select, input[type="text"], input[type="number"] {
      width: 100%;
      background: #0f172a;
      border: 1px solid #334155;
      padding: 9px 10px;
      border-radius: 6px;
      color: #fff;
      font-size: 0.85rem;
      font-family: monospace;
    }
    select:focus, input:focus { outline: none; border-color: #38bdf8; }

    .options-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 10px;
      margin-bottom: 14px;
    }
    .opt-card {
      background: #0f172a;
      border: 1px solid #334155;
      padding: 10px;
      border-radius: 8px;
      font-size: 0.82rem;
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 8px;
    }
    .opt-card input { cursor: pointer; }

    .btn-row { display: flex; gap: 10px; margin-top: 6px; }
    button {
      flex: 1;
      background: #2563eb;
      color: white;
      border: none;
      padding: 12px;
      border-radius: 6px;
      font-size: 0.95rem;
      font-weight: 600;
      cursor: pointer;
      transition: background 0.2s;
    }
    button:hover { background: #1d4ed8; }
    button:disabled { background: #475569; cursor: not-allowed; }
    .btn-stop { background: #dc2626; }
    .btn-stop:hover { background: #b91c1c; }

    .progress-box {
      margin: 16px 0 6px 0;
      background: #0f172a;
      border-radius: 6px;
      height: 12px;
      overflow: hidden;
      border: 1px solid #334155;
    }
    .progress-bar { height: 100%; width: 0%; background: #38bdf8; transition: width 0.15s ease; }
    
    .stats-row {
      display: flex;
      justify-content: space-between;
      font-size: 0.78rem;
      color: #94a3b8;
      font-family: monospace;
      margin-bottom: 12px;
    }
    #console {
      background: #020617;
      border: 1px solid #334155;
      border-radius: 6px;
      padding: 12px;
      font-family: monospace;
      font-size: 0.74rem;
      height: 180px;
      overflow-y: auto;
      color: #a5f3fc;
    }
  </style>
</head>
<body>

<div class="card">
  <h2>Extractor de Ticks Deriv (Conexión Directa Robusta)</h2>
  <p>Descarga paginada en bloques de 5.000 ticks sin requerir token.</p>

  <div id="statusBadge" class="badge">
    <span class="dot"></span>
    <span id="badgeText">Listo para iniciar</span>
  </div>

  <div class="grid-3">
    <div>
      <label for="assetSelect">Activo:</label>
      <select id="assetSelect">
        <optgroup label="Sintéticos 1s">
          <option value="1HZ75V" selected>1HZ75V (Volatility 75 1s)</option>
          <option value="1HZ10V">1HZ10V (Volatility 10 1s)</option>
          <option value="1HZ100V">1HZ100V (Volatility 100 1s)</option>
        </optgroup>
        <optgroup label="Sintéticos Estándar 2s">
          <option value="R_75">R_75 (Volatility 75)</option>
          <option value="R_100">R_100 (Volatility 100)</option>
        </optgroup>
      </select>
    </div>

    <div>
      <label for="appIdInput">App ID:</label>
      <input type="text" id="appIdInput" value="1089">
    </div>

    <div>
      <label for="targetCount">Cantidad Ticks:</label>
      <input type="number" id="targetCount" value="100000" step="5000" min="5000">
    </div>
  </div>

  <div class="options-grid">
    <label class="opt-card">
      <input type="radio" name="format" value="csv" checked>
      <span>CSV Plano (.csv)</span>
    </label>
    <label class="opt-card">
      <input type="radio" name="format" value="gz">
      <span>Comprimido (.csv.gz)</span>
    </label>
  </div>

  <div class="btn-row">
    <button id="btnStart" onclick="iniciarExtraccion()">Iniciar Extracción</button>
    <button id="btnStop" class="btn-stop" onclick="detenerExtraccion()" style="display: none;">Detener y Descargar</button>
  </div>

  <div class="progress-box">
    <div id="bar" class="progress-bar"></div>
  </div>

  <div class="stats-row">
    <span id="statCount">Ticks: 0 / 100.000</span>
    <span id="statPct">0%</span>
  </div>

  <div id="console">> Selecciona el activo y haz clic en "Iniciar Extracción"...</div>
</div>

<script>
// Lista de hosts seguros de Deriv
const SERVERS = [
  'wss://ws.derivws.com/websockets/v3',
  'wss://red.derivws.com/websockets/v3',
  'wss://blue.derivws.com/websockets/v3'
];

const BATCH_SIZE = 5000;
let ws = null;
let allTicks = [];
let currentEnd = 'latest';
let isRunning = false;
let selectedSymbol = '1HZ75V';
let targetTicks = 100000;
let serverIdx = 0;
let timeoutTimer = null;

function log(msg, color = '#a5f3fc') {
  const el = document.getElementById('console');
  const t = new Date().toTimeString().split(' ')[0];
  el.innerHTML += `<div style="color:${color}">[${t}] ${msg}</div>`;
  el.scrollTop = el.scrollHeight;
}

function updateProgress(count) {
  const pct = Math.min(100, Math.round((count / targetTicks) * 100));
  document.getElementById('bar').style.width = pct + '%';
  document.getElementById('statCount').innerText = `Ticks: ${count.toLocaleString()} / ${targetTicks.toLocaleString()}`;
  document.getElementById('statPct').innerText = `${pct}%`;
}

function setBadge(text, type = 'normal') {
  const b = document.getElementById('statusBadge');
  document.getElementById('badgeText').innerText = text;
  b.className = 'badge ' + (type === 'err' ? 'err' : (type === 'busy' ? 'busy' : ''));
}

function limpiarSocket() {
  if (timeoutTimer) {
    clearTimeout(timeoutTimer);
    timeoutTimer = null;
  }
  if (ws) {
    // Desvincular manejadores para evitar ejecuciones en cascada
    ws.onopen = null;
    ws.onmessage = null;
    ws.onerror = null;
    ws.onclose = null;
    try { ws.close(); } catch (e) {}
    ws = null;
  }
}

function iniciarExtraccion() {
  if (isRunning) return;

  selectedSymbol = document.getElementById('assetSelect').value;
  targetTicks = parseInt(document.getElementById('targetCount').value, 10) || 100000;

  isRunning = true;
  allTicks = [];
  currentEnd = 'latest';
  serverIdx = 0;
  updateProgress(0);

  document.getElementById('btnStart').style.display = 'none';
  document.getElementById('btnStop').style.display = 'block';
  document.getElementById('assetSelect').disabled = true;
  document.getElementById('appIdInput').disabled = true;
  document.getElementById('targetCount').disabled = true;

  conectarServidor();
}

function conectarServidor() {
  if (!isRunning) return;

  limpiarSocket();

  const host = SERVERS[serverIdx];
  const appId = document.getElementById('appIdInput').value.trim() || '1089';
  const url = `${host}?app_id=${appId}`;

  setBadge(`Conectando a ${host.split('//')[1].split('/')[0]}...`, 'busy');
  log(`Abriendo enlace: ${url}...`, '#38bdf8');

  // Timeout preventivo de 8 segundos por servidor
  timeoutTimer = setTimeout(() => {
    log(`Servidor ${host} no respondió a tiempo. Probando siguiente...`, '#ef4444');
    saltarSiguienteServidor();
  }, 8000);

  try {
    ws = new WebSocket(url);
  } catch (err) {
    saltarSiguienteServidor();
    return;
  }

  ws.onopen = () => {
    if (timeoutTimer) {
      clearTimeout(timeoutTimer);
      timeoutTimer = null;
    }
    setBadge(`Conectado: ${host.split('//')[1].split('/')[0]}`);
    log(`✔ Conexión establecida con éxito. Solicitando primer lote de ${selectedSymbol}...`, '#4ade80');
    solicitarLote();
  };

  ws.onmessage = (event) => {
    if (!isRunning) return;

    try {
      const data = JSON.parse(event.data);

      if (data.error) {
        log(`[Error API]: ${data.error.message}`, '#ef4444');
        saltarSiguienteServidor();
        return;
      }

      if (data.msg_type === 'history') {
        const times = data.history.times || [];
        const prices = data.history.prices || [];

        if (!times.length) {
          log('Fin del historial devuelto por Deriv.', '#facc15');
          finalizar(true);
          return;
        }

        const batch = times.map((t, i) => ({ epoch: t, price: prices[i] }));
        allTicks = batch.concat(allTicks);

        updateProgress(allTicks.length);
        log(`Descargados: ${allTicks.length.toLocaleString()} / ${targetTicks.toLocaleString()} ticks`);

        if (allTicks.length >= targetTicks) {
          allTicks = allTicks.slice(allTicks.length - targetTicks);
          finalizar(true);
        } else {
          currentEnd = times[0] - 1;
          setTimeout(solicitarLote, 130);
        }
      }
    } catch (e) {
      console.error(e);
    }
  };

  ws.onerror = () => {
    log(`Error de red en ${host}.`, '#ef4444');
    saltarSiguienteServidor();
  };

  ws.onclose = () => {
    if (isRunning && allTicks.length < targetTicks) {
      log(`Conexión cerrada por ${host}.`, '#f87171');
      saltarSiguienteServidor();
    }
  };
}

function saltarSiguienteServidor() {
  limpiarSocket();

  serverIdx++;
  if (serverIdx >= SERVERS.length) {
    log('Se intentaron todos los servidores sin éxito.', '#ef4444');
    setBadge('Fallo de conexión', 'err');
    finalizar(allTicks.length > 0);
    return;
  }

  log(`Cambiando de nodo. Intentando con servidor alternativo...`, '#f59e0b');
  setTimeout(conectarServidor, 600);
}

function solicitarLote() {
  if (!ws || ws.readyState !== WebSocket.OPEN || !isRunning) return;
  ws.send(JSON.stringify({
    ticks_history: selectedSymbol,
    adjust_start_time: 1,
    count: BATCH_SIZE,
    end: currentEnd,
    style: 'ticks'
  }));
}

function detenerExtraccion() {
  if (!isRunning) return;
  log('Detención manual. Generando archivo con los datos obtenidos...', '#f59e0b');
  finalizar(allTicks.length > 0);
}

function finalizar(generarDescarga) {
  isRunning = false;
  limpiarSocket();

  document.getElementById('btnStart').style.display = 'block';
  document.getElementById('btnStop').style.display = 'none';
  document.getElementById('assetSelect').disabled = false;
  document.getElementById('appIdInput').disabled = false;
  document.getElementById('targetCount').disabled = false;

  if (generarDescarga && allTicks.length > 0) {
    generarArchivo();
  }
}

function generarArchivo() {
  log(`Exportando ${allTicks.length.toLocaleString()} registros de ${selectedSymbol}...`, '#38bdf8');

  let csv = 'epoch,datetime_utc,symbol,price\n';
  for (let i = 0; i < allTicks.length; i++) {
    const t = allTicks[i];
    const iso = new Date(t.epoch * 1000).toISOString();
    csv += `${t.epoch},${iso},${selectedSymbol},${t.price}\n`;
  }

  const formato = document.querySelector('input[name="format"]:checked').value;
  const ts = Date.now();
  const filename = `deriv_${selectedSymbol}_${allTicks.length}k_${ts}`;

  if (formato === 'gz') {
    const compressed = pako.gzip(csv);
    const blob = new Blob([compressed], { type: 'application/gzip' });
    descargarBlob(blob, `${filename}.csv.gz`);
  } else {
    const blob = new Blob([csv], { type: 'text/csv;charset=utf-8;' });
    descargarBlob(blob, `${filename}.csv`);
  }

  log(`✔ Archivo descargado exitosamente: ${filename}`, '#4ade80');
}

function descargarBlob(blob, filename) {
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url;
  a.download = filename;
  document.body.appendChild(a);
  a.click();
  document.body.removeChild(a);
  URL.revokeObjectURL(url);
}
</script>
</body>
</html>
