<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <title>Extractor Deriv V75 (1s)</title>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/pako/2.1.0/pako.min.js"></script>
  <style>
    * { box-sizing: border-box; }
    body { background: #090d16; color: #f1f5f9; font-family: system-ui, sans-serif; display: flex; justify-content: center; align-items: center; min-height: 100vh; margin: 0; padding: 16px; }
    .card { background: #1e293b; padding: 24px; border-radius: 12px; width: 100%; max-width: 500px; border: 1px solid #334155; }
    h2 { margin-top: 0; color: #38bdf8; font-size: 1.2rem; }
    p { color: #94a3b8; font-size: 0.85rem; margin-bottom: 1rem; }
    button { background: #2563eb; color: white; border: none; padding: 12px; border-radius: 6px; font-size: 1rem; font-weight: 600; cursor: pointer; width: 100%; }
    button:disabled { background: #475569; cursor: not-allowed; }
    .progress-box { margin: 14px 0; background: #0f172a; border-radius: 6px; height: 10px; overflow: hidden; border: 1px solid #334155; }
    .progress-bar { height: 100%; width: 0%; background: #38bdf8; transition: width 0.2s; }
    #console { background: #020617; border: 1px solid #334155; border-radius: 6px; padding: 12px; font-family: monospace; font-size: 0.8rem; height: 190px; overflow-y: auto; color: #a5f3fc; }
  </style>
</head>
<body>

<div class="card">
  <h2>Extractor V75 (1s) - 100k Ticks</h2>
  <p>Probando servidores alternativos de Deriv contra bloqueos de ISP.</p>

  <button id="btn" onclick="iniciar()">Iniciar Extracción</button>

  <div class="progress-box">
    <div id="bar" class="progress-bar"></div>
  </div>

  <div id="console">> Presiona Iniciar para buscar servidor disponible...</div>
</div>

<script>
const SYMBOL = '1HZ75V';
const TARGET = 100000;
const BATCH = 5000;

// Lista de endpoints oficiales alternativos que esquivan los bloqueos DNS habituales
const SERVERS = [
  "wss://ws.derivws.com/websockets/v3?app_id=1089",
  "wss://frontend.binaryws.com/websockets/v3?app_id=1089",
  "wss://green.derivws.com/websockets/v3?app_id=1089",
  "wss://red.derivws.com/websockets/v3?app_id=1089",
  "wss://blue.derivws.com/websockets/v3?app_id=1089"
];

let serverIndex = 0;
let ws = null;
let allTicks = [];
let currentEnd = 'latest';

function log(msg, color = '#a5f3fc') {
  const el = document.getElementById('console');
  el.innerHTML += `<div style="color:${color}">> ${msg}</div>`;
  el.scrollTop = el.scrollHeight;
}

function updateProgress(count) {
  const pct = Math.min(100, Math.round((count / TARGET) * 100));
  document.getElementById('bar').style.width = pct + '%';
}

function iniciar() {
  document.getElementById('btn').disabled = true;
  allTicks = [];
  currentEnd = 'latest';
  serverIndex = 0;
  probarServidor();
}

function probarServidor() {
  if (serverIndex >= SERVERS.length) {
    log('Tu proveedor de internet está bloqueando todos los servidores de Deriv por DNS. Activa DNS seguro (1.1.1.1) en tu navegador para continuar.', '#ef4444');
    document.getElementById('btn').disabled = false;
    return;
  }

  const url = SERVERS[serverIndex];
  log(`Probando servidor ${serverIndex + 1}/${SERVERS.length}...`);

  try {
    ws = new WebSocket(url);
  } catch(e) {
    siguienteServidor();
    return;
  }

  ws.onopen = () => {
    log(`¡Conectado exitosamente con el servidor ${serverIndex + 1}!`, '#4ade80');
    pedirLote();
  };

  ws.onmessage = (event) => {
    const data = JSON.parse(event.data);

    if (data.error) {
      log(`Error Deriv: ${data.error.message}`, '#f87171');
      cerrar();
      return;
    }

    if (data.msg_type === 'history') {
      const times = data.history.times || [];
      const prices = data.history.prices || [];

      if (!times.length) {
        log('Fin del historial.', '#facc15');
        descargar();
        return;
      }

      const batch = times.map((t, i) => ({ epoch: t, price: prices[i] }));
      allTicks = batch.concat(allTicks);

      updateProgress(allTicks.length);
      log(`Descargados: ${allTicks.length.toLocaleString()} / ${TARGET.toLocaleString()} ticks`);

      if (allTicks.length >= TARGET) {
        allTicks = allTicks.slice(allTicks.length - TARGET);
        descargar();
      } else {
        currentEnd = times[0] - 1;
        setTimeout(pedirLote, 120);
      }
    }
  };

  ws.onerror = () => {
    log(`Servidor ${serverIndex + 1} no respondió (bloqueado por red).`, '#f87171');
    siguienteServidor();
  };
}

function siguienteServidor() {
  if (ws) {
    try { ws.close(); } catch(e){}
  }
  serverIndex++;
  setTimeout(probarServidor, 400);
}

function pedirLote() {
  ws.send(JSON.stringify({
    ticks_history: SYMBOL,
    adjust_start_time: 1,
    count: BATCH,
    end: currentEnd,
    style: 'ticks'
  }));
}

function cerrar() {
  document.getElementById('btn').disabled = false;
  if (ws) ws.close();
}

function descargar() {
  log('Comprimiendo CSV...', '#4ade80');
  let csv = 'epoch,datetime_utc,price\n';
  for (let i = 0; i < allTicks.length; i++) {
    const t = allTicks[i];
    csv += `${t.epoch},${new Date(t.epoch * 1000).toISOString()},${t.price}\n`;
  }

  const compressed = pako.gzip(csv);
  const blob = new Blob([compressed], { type: 'application/gzip' });
  const url = URL.createObjectURL(blob);

  const a = document.createElement('a');
  a.href = url;
  a.download = `deriv_1HZ75V_100k_${Date.now()}.csv.gz`;
  document.body.appendChild(a);
  a.click();
  document.body.removeChild(a);
  URL.revokeObjectURL(url);

  log('¡Archivo descargado con éxito!', '#4ade80');
  cerrar();
}
</script>
</body>
</html>
