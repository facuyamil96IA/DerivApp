<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <title>Detector de Cuentas Deriv API</title>
  <style>
    body { background: #090d16; color: #f1f5f9; font-family: monospace; padding: 25px; }
    .card { background: #151b23; border: 1px solid #30363d; border-radius: 8px; padding: 20px; max-width: 600px; margin: 0 auto; }
    h2 { color: #38bdf8; margin-top: 0; }
    button { background: #2563eb; color: #fff; border: none; padding: 10px 16px; border-radius: 6px; cursor: pointer; font-weight: bold; width: 100%; margin-top: 10px; }
    button:hover { background: #1d4ed8; }
    .acc-item { background: #0d1117; border: 1px solid #30363d; padding: 12px; margin-top: 10px; border-radius: 6px; }
    .demo { border-left: 4px solid #38bdf8; }
    .real { border-left: 4px solid #2ea043; }
    #log { background: #020617; border: 1px solid #30363d; padding: 10px; border-radius: 6px; margin-top: 15px; font-size: 0.8rem; color: #94a3b8; height: 120px; overflow-y: auto; }
  </style>
</head>
<body>

<div class="card">
  <h2>Detector Automático de Cuentas</h2>
  <p>Conectando con tu token PAT mediante WebSocket oficial...</p>
  <button onclick="descubrirCuentas()">Consultar Mis Cuentas</button>

  <div id="cuentasContenedor"></div>
  <div id="log">> Haz clic en el botón para consultar tus IDs de cuenta...</div>
</div>

<script>
const TOKEN = "pat_cf363ab19a46e65088da18ac183dc690a4acc7b950790d54dcc932aafccf493d";
const WS_URL = "wss://red.derivws.com/websockets/v3?app_id=1089";

function log(msg, color="#94a3b8") {
  const el = document.getElementById('log');
  el.innerHTML += `<div style="color:${color}">[${new Date().toLocaleTimeString()}] ${msg}</div>`;
  el.scrollTop = el.scrollHeight;
}

function descubrirCuentas() {
  log("Abriendo WebSocket oficial...", "#38bdf8");
  const ws = new WebSocket(WS_URL);

  ws.onopen = () => {
    log("Enviando token PAT para autorización...", "#f0883e");
    ws.send(JSON.stringify({ authorize: TOKEN }));
  };

  ws.onmessage = (evt) => {
    const data = JSON.parse(evt.data);

    if (data.error) {
      log(`Error Deriv: ${data.error.message}`, "#f85149");
      ws.close();
      return;
    }

    if (data.msg_type === "authorize") {
      log("✔ Autenticación exitosa.", "#2ea043");
      const auth = data.authorize;
      const contenedor = document.getElementById("cuentasContenedor");
      contenedor.innerHTML = "";

      const lista = auth.account_list && auth.account_list.length > 0 ? auth.account_list : [auth];

      lista.forEach(acc => {
        const id = acc.loginid || acc.account;
        const isVirtual = acc.is_virtual === 1 || id.startsWith("VRTC");
        const tipo = isVirtual ? "DEMO (Virtual)" : "REAL";
        const clase = isVirtual ? "demo" : "real";
        const saldo = (acc.loginid === auth.loginid) ? `$${parseFloat(auth.balance).toFixed(2)} ${auth.currency}` : "Disponible";

        contenedor.innerHTML += `
          <div class="acc-item ${clase}">
            <strong>${tipo}:</strong> <span style="color:#fff; font-size:1.1rem;">${id}</span><br>
            <small style="color:#94a3b8;">Moneda: ${acc.currency || 'USD'} | Saldo: ${saldo}</small>
          </div>
        `;
        log(`Encontrada cuenta: ${id} (${tipo})`, "#38bdf8");
      });

      ws.close();
    }
  };

  ws.onerror = () => log("Error de conexión al WebSocket.", "#f85149");
}
</script>
</body>
</html>
