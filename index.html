<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Test Conexión Wi-Fi Deriv</title>
  <style>
    body { background: #090d16; color: #f1f5f9; font-family: sans-serif; padding: 20px; }
    .card { background: #1e293b; padding: 20px; border-radius: 12px; max-width: 450px; margin: 0 auto; border: 1px solid #334155; }
    button { width: 100%; padding: 14px; background: #2563eb; color: #fff; border: none; border-radius: 8px; font-weight: bold; font-size: 1rem; margin-top: 10px; cursor: pointer; }
    #log { background: #020617; border: 1px solid #334155; border-radius: 8px; padding: 12px; font-family: monospace; font-size: 0.75rem; height: 220px; overflow-y: auto; color: #38bdf8; margin-top: 15px; }
  </style>
</head>
<body>

<div class="card">
  <h3>Diagnóstico Wi-Fi Deriv API</h3>
  <p style="font-size:0.8rem; color:#94a3b8;">Verifica qué servidor responde en tu red Wi-Fi con el App ID numérico oficial (1089).</p>
  
  <button onclick="probarServidores()">Probar Conexión Wi-Fi</button>
  <div id="log">> Pulsa el botón para probar los servidores en tu Wi-Fi...</div>
</div>

<script>
const SERVIDORES = [
  { nombre: "Servidor Oficial", url: "wss://ws.derivws.com/websockets/v3?app_id=1089" },
  { nombre: "Servidor Clásico (Binary)", url: "wss://ws.binaryws.com/websockets/v3?app_id=1089" },
  { nombre: "Servidor Red", url: "wss://red.derivws.com/websockets/v3?app_id=1089" }
];

function escribir(msg, color = "#38bdf8") {
  const box = document.getElementById("log");
  const t = new Date().toTimeString().split(" ")[0];
  box.innerHTML += `<div style="color:${color}">[${t}] ${msg}</div>`;
  box.scrollTop = box.scrollHeight;
}

async function probarServidores() {
  document.getElementById("log").innerHTML = "";
  escribir("Iniciando prueba sobre tu red Wi-Fi...");

  for (const srv of SERVIDORES) {
    escribir(`Conectando a ${srv.nombre}...`, "#f59e0b");
    const ok = await testSocket(srv.url);
    if (ok) {
      escribir(`✔ ${srv.nombre} FUNCIONA CORRECTAMENTE`, "#34d399");
      escribir(`Probando petición de ticks en ${srv.nombre}...`, "#f59e0b");
      await testTicks(srv.url);
      break;
    } else {
      escribir(`✖ ${srv.nombre} bloqueado o sin respuesta en tu Wi-Fi`, "#f87171");
    }
  }
}

function testSocket(url) {
  return new Promise((resolve) => {
    try {
      const s = new WebSocket(url);
      const timer = setTimeout(() => {
        try { s.close(); } catch(e){}
        resolve(false);
      }, 5000);

      s.onopen = () => {
        clearTimeout(timer);
        try { s.close(); } catch(e){}
        resolve(true);
      };
      s.onerror = () => {
        clearTimeout(timer);
        resolve(false);
      };
    } catch(e) {
      resolve(false);
    }
  });
}

function testTicks(url) {
  return new Promise((resolve) => {
    const s = new WebSocket(url);
    s.onopen = () => {
      s.send(JSON.stringify({
        ticks_history: "1HZ75V",
        adjust_start_time: 1,
        count: 5,
        end: "latest",
        style: "ticks"
      }));
    };
    s.onmessage = (e) => {
      const res = JSON.parse(e.data);
      if (res.history) {
        escribir(`✔ Ticks recibidos: Último precio = ${res.history.prices.slice(-1)[0]}`, "#34d399");
      } else if (res.error) {
        escribir(`Respuesta Deriv: ${res.error.message}`, "#f87171");
      }
      s.close();
      resolve();
    };
    s.onerror = () => {
      escribir("Error al solicitar ticks", "#f87171");
      resolve();
    };
  });
}
</script>
</body>
</html>
