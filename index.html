<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <title>Extractor de Ticks Deriv V75 (1s)</title>
  <!-- Pako para comprimir directamente en el cliente a .csv.gz -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/pako/2.1.0/pako.min.js"></script>
  <style>
    * { box-sizing: border-box; }
    body {
      background: #090d16;
      color: #f1f5f9;
      font-family: system-ui, -apple-system, sans-serif;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      margin: 0;
      padding: 16px;
    }
    .card {
      background: #1e293b;
      padding: 28px;
      border-radius: 12px;
      width: 100%;
      max-width: 520px;
      box-shadow: 0 10px 30px rgba(0,0,0,0.6);
      border: 1px solid #334155;
    }
    h2 { margin-top: 0; color: #38bdf8; font-size: 1.3rem; }
    p { color: #94a3b8; font-size: 0.85rem; margin-bottom: 1.2rem; }
    .field {
      margin-bottom: 16px;
    }
    label {
      display: block;
      font-size: 0.8rem;
      color: #cbd5e1;
      margin-bottom: 6px;
      font-weight: 600;
    }
    input {
      width: 100%;
      background: #0f172a;
      border: 1px solid #334155;
      padding: 10px 12px;
      border-radius: 6px;
      color: #fff;
      font-size: 0.95rem;
    }
    input:focus { outline: none; border-color: #38bdf8; }
    button {
      background: #2563eb;
      color: white;
      border: none;
      padding: 12px;
      border-radius: 6px;
      font-size: 1rem;
      font-weight: 600;
      cursor: pointer;
      width: 100%;
      margin-top: 8px;
      transition: background 0.2s;
    }
    button:hover { background: #1d4ed8; }
    button:disabled { background: #475569; cursor: not-allowed; }
    .progress-box {
      margin: 16px 0;
      background: #0f172a;
      border-radius: 6px;
      height: 10px;
      overflow: hidden;
      border: 1px solid #334155;
    }
    .progress-bar {
      height: 100%;
      width: 0%;
      background: #38bdf8;
      transition: width 0.2s ease;
    }
    #console {
      background: #020617;
      border: 1px solid #334155;
      border-radius: 6px;
      padding: 12px;
      font-family: monospace;
      font-size: 0.8rem;
      height: 180px;
      overflow-y: auto;
      color: #a5f3fc;
    }
  </style>
</head>
<body>

<div class="card">
  <h2>Extractor Deriv: Volatility 75 (1s)</h2>
  <p>Descarga directa de 100.000 ticks en archivo comprimido <code>.csv.gz</code>.</p>

  <div class="field">
    <label for="appId">Tu App ID registrado en Deriv:</label>
    <input type="text" id="appId" placeholder="Ej: 61423" />
  </div>

  <button id="btnStart" onclick="iniciar()">Iniciar Extracción</button>

  <div class="progress-box">
    <div id="bar" class="progress-bar"></div>
  </div>

  <div id="console">> Esperando App ID para iniciar conexión...</div>
</div>

<script>
const SYMBOL = '1HZ75V'; // Volatility 75 (1s)
const TARGET = 100000;
const BATCH = 5000;

let ws = null;
let ticks = [];
let currentEnd = 'latest';

function log(msg, color = '#a5f3fc') {
  const el = document.getElementById('console');
  el.innerHTML += `<div style="color:${color}">> ${msg}</div>`;
  el.scrollTop = el.scrollHeight;
}

function updateProgress(count) {
  const pct = Math.min(100, Math.round((count / TARGET) * 100));
  document.getElementById('bar').style.width = pct + '%';
}

function iniciar() {
  const appId = document.getElementById('appId').value.trim();
  if (!appId) {
    alert('Ingresa tu App ID registrado en api.deriv.com');
    return;
  }

  document.getElementById('btnStart').disabled = true;
  document.getElementById('appId').disabled = true;
  ticks = [];
  currentEnd = 'latest';

  const wsUrl = `wss://ws.derivws.com/websockets/v3?app_id=${appId}`;
  log(`Conectando a Deriv WebSocket (App ID: ${appId})...`);

  ws = new WebSocket(wsUrl);

  ws.onopen = () => {
    log('¡Conexión establecida con éxito! Solicitando ticks...');
    pedirLote();
  };

  ws.onmessage = (event) => {
    const data = JSON.parse(event.data);

    if (data.error) {
      log(`Error de Deriv: ${data.error.message}`, '#f87171');
      cerrar();
      return;
    }

    if (data.msg_type === 'history') {
      const times = data.history.times || [];
      const prices = data.history.prices || [];

      if (!times.length) {
        log('No se recibieron más ticks.', '#facc15');
        generarArchivo();
        return;
      }

      const batch = times.map((t, i) => ({ epoch: t, price: prices[i] }));
      ticks = batch.concat(ticks);

      updateProgress(ticks.length);
      log(`Descargados: ${ticks.length.toLocaleString()} / ${TARGET.toLocaleString()} ticks`);

      if (ticks.length >= TARGET) {
        ticks = ticks.slice(ticks.length - TARGET);
        generarArchivo();
      } else {
        // El siguiente lote retrocede en el tiempo antes del tick más antiguo recibido
        currentEnd = times[0] - 1;
        setTimeout(pedirLote, 150);
      }
    }
  };

  ws.onerror = () => {
    log('Error de WebSocket. Verifica que la URL del navegador coincida con la Redirect URL registrada en tu App ID.', '#ef4444');
    cerrar();
  };
}

function pedirLote() {
  ws.send(JSON.stringify({
    ticks_history: SYMBOL,
    adjust_start_time: 1,
    count: BATCH,
    end: currentEnd,
    style: 'ticks'
  }));
}

function cerrar() {
  document.getElementById('btnStart').disabled = false;
  document.getElementById('appId').disabled = false;
  if (ws) ws.close();
}

function generarArchivo() {
  log('Generando archivo CSV...');
  let csv = 'epoch,datetime_utc,price\n';
  for (let i = 0; i < ticks.length; i++) {
    const t = ticks[i];
    csv += `${t.epoch},${new Date(t.epoch * 1000).toISOString()},${t.price}\n`;
  }

  log('Comprimiendo con Gzip (.csv.gz)...');
  const compressed = pako.gzip(csv);
  const blob = new Blob([compressed], { type: 'application/gzip' });
  const url = URL.createObjectURL(blob);

  const a = document.createElement('a');
  a.href = url;
  a.download = `deriv_1HZ75V_100k_${Date.now()}.csv.gz`;
  document.body.appendChild(a);
  a.click();
  document.body.removeChild(a);
  URL.revokeObjectURL(url);

  log('¡Descarga completada! Sube el archivo aquí.', '#4ade80');
  cerrar();
}
</script>
</body>
</html>
