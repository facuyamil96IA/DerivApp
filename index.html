<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Extractor Universal Deriv (Móvil HTTP/WSS)</title>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/pako/2.1.0/pako.min.js"></script>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      background: #090d16;
      color: #f1f5f9;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      padding: 14px;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      justify-content: center;
    }
    .card {
      background: #1e293b;
      padding: 18px;
      border-radius: 12px;
      width: 100%;
      max-width: 480px;
      margin: 0 auto;
      border: 1px solid #334155;
      box-shadow: 0 8px 24px rgba(0,0,0,0.5);
    }
    h2 { color: #38bdf8; font-size: 1.15rem; margin-bottom: 4px; }
    p { color: #94a3b8; font-size: 0.78rem; margin-bottom: 12px; }
    
    .badge {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      background: #064e3b;
      color: #34d399;
      font-size: 0.72rem;
      padding: 4px 8px;
      border-radius: 6px;
      font-family: monospace;
      margin-bottom: 12px;
    }
    .badge.busy { background: #451a03; color: #f59e0b; }
    .badge.err { background: #450a0a; color: #f87171; }
    .dot { width: 7px; height: 7px; border-radius: 50%; background: currentColor; }

    .form-group { margin-bottom: 10px; }
    label { display: block; font-size: 0.75rem; color: #cbd5e1; margin-bottom: 4px; font-weight: 600; }
    select, input {
      width: 100%;
      background: #0f172a;
      border: 1px solid #334155;
      padding: 10px;
      border-radius: 8px;
      color: #fff;
      font-size: 0.88rem;
      font-family: monospace;
      outline: none;
    }

    .options-row {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 8px;
      margin-bottom: 12px;
    }
    .opt-label {
      background: #0f172a;
      border: 1px solid #334155;
      padding: 8px;
      border-radius: 8px;
      font-size: 0.78rem;
      display: flex;
      align-items: center;
      gap: 6px;
    }

    button {
      width: 100%;
      background: #2563eb;
      color: white;
      border: none;
      padding: 12px;
      border-radius: 8px;
      font-size: 0.95rem;
      font-weight: 700;
      cursor: pointer;
      margin-top: 4px;
    }
    button:disabled { background: #475569; }
    .btn-stop { background: #dc2626; }

    .progress-track {
      background: #0f172a;
      border-radius: 6px;
      height: 10px;
      overflow: hidden;
      margin: 14px 0 6px 0;
      border: 1px solid #334155;
    }
    .progress-fill { height: 100%; width: 0%; background: #38bdf8; transition: width 0.15s; }
    
    .stats-line {
      display: flex;
      justify-content: space-between;
      font-size: 0.75rem;
      color: #94a3b8;
      font-family: monospace;
      margin-bottom: 10px;
    }
    #console {
      background: #020617;
      border: 1px solid #334155;
      border-radius: 8px;
      padding: 10px;
      font-family: monospace;
      font-size: 0.72rem;
      height: 150px;
      overflow-y: auto;
      color: #a5f3fc;
    }
  </style>
</head>
<body>

<div class="card">
  <h2>Extractor de Ticks Deriv (Universal)</h2>
  <p>Canal HTTPS directo sin bloqueos de Origin ni Cloudflare.</p>

  <div id="statusBadge" class="badge">
    <span class="dot"></span>
    <span id="badgeText">Listo para descargar</span>
  </div>

  <div class="form-group">
    <label>Activo Sintético:</label>
    <select id="assetSelect">
      <option value="1HZ75V" selected>1HZ75V (Volatility 75 1s)</option>
      <option value="1HZ10V">1HZ10V (Volatility 10 1s)</option>
      <option value="1HZ100V">1HZ100V (Volatility 100 1s)</option>
      <option value="R_75">R_75 (Volatility 75 2s)</option>
      <option value="R_100">R_100 (Volatility 100 2s)</option>
    </select>
  </div>

  <div class="form-group">
    <label>Cantidad de Ticks:</label>
    <input type="number" id="targetCount" value="100000" step="5000" min="5000">
  </div>

  <div class="options-row">
    <label class="opt-label">
      <input type="radio" name="format" value="csv" checked>
      <span>CSV (.csv)</span>
    </label>
    <label class="opt-label">
      <input type="radio" name="format" value="gz">
      <span>Gzip (.csv.gz)</span>
    </label>
  </div>

  <button id="btnStart" onclick="iniciarExtraccion()">▶ Iniciar Descarga Directa</button>
  <button id="btnStop" class="btn-stop" onclick="detener()" style="display:none;">⏹ Detener y Guardar</button>

  <div class="progress-track">
    <div id="bar" class="progress-fill"></div>
  </div>

  <div class="stats-line">
    <span id="statCount">Ticks: 0 / 100.000</span>
    <span id="statPct">0%</span>
  </div>

  <div id="console">> Selecciona el activo y presiona Iniciar...</div>
</div>

<script>
const BATCH_SIZE = 5000;
let allTicks = [];
let currentEnd = 'latest';
let isRunning = false;
let selectedSymbol = '1HZ75V';
let targetTicks = 100000;

function log(msg, color = '#a5f3fc') {
  const el = document.getElementById('console');
  const t = new Date().toTimeString().split(' ')[0];
  el.innerHTML += `<div style="color:${color}">[${t}] ${msg}</div>`;
  el.scrollTop = el.scrollHeight;
}

function updateProgress(count) {
  const pct = Math.min(100, Math.round((count / targetTicks) * 100));
  document.getElementById('bar').style.width = pct + '%';
  document.getElementById('statCount').innerText = `${count.toLocaleString()} / ${targetTicks.toLocaleString()}`;
  document.getElementById('statPct').innerText = `${pct}%`;
}

function setBadge(text, type = 'normal') {
  const b = document.getElementById('statusBadge');
  document.getElementById('badgeText').innerText = text;
  b.className = 'badge ' + (type === 'err' ? 'err' : (type === 'busy' ? 'busy' : ''));
}

async function iniciarExtraccion() {
  if (isRunning) return;

  selectedSymbol = document.getElementById('assetSelect').value;
  targetTicks = parseInt(document.getElementById('targetCount').value, 10) || 100000;

  isRunning = true;
  allTicks = [];
  currentEnd = 'latest';
  updateProgress(0);

  document.getElementById('btnStart').style.display = 'none';
  document.getElementById('btnStop').style.display = 'block';
  document.getElementById('assetSelect').disabled = true;
  document.getElementById('targetCount').disabled = true;

  setBadge('Descargando por HTTPS...', 'busy');
  log(`Iniciando extracción directa de ${selectedSymbol}...`, '#38bdf8');

  // Ejecutar el ciclo de descarga en lotes de 5.000 ticks
  descargarLotes();
}

async function descargarLotes() {
  while (isRunning && allTicks.length < targetTicks) {
    try {
      const endParam = currentEnd === 'latest' ? Math.floor(Date.now() / 1000) : currentEnd;
      // Gateway HTTPS oficial de cotizaciones de Deriv (sin bloqueo de Origin WebSocket)
      const url = `https://api.deriv.com/chart/ticks?symbol=${selectedSymbol}&end=${endParam}&count=${BATCH_SIZE}`;

      let data = null;
      try {
        const response = await fetch(url, { headers: { 'Accept': 'application/json' } });
        if (response.ok) {
          data = await response.json();
        }
      } catch (e) {
        // Si el endpoint REST directo requiere fallback, conectamos vía canal WebSocket limpio
      }

      // Si no devolvió datos por REST, usamos el tunnel directo de datos
      if (!data || !data.times || !data.times.length) {
        log(`Extrayendo lote por canal de cotizaciones...`, '#f59e0b');
        data = await pedirLoteWebSocket(selectedSymbol, currentEnd, BATCH_SIZE);
      }

      if (!data || !data.times || !data.times.length) {
        log('Fin del historial devuelto por el servidor.', '#facc15');
        break;
      }

      const times = data.times;
      const prices = data.prices;

      const batch = times.map((t, i) => ({ epoch: t, price: prices[i] }));
      allTicks = batch.concat(allTicks);

      updateProgress(allTicks.length);
      log(`Acumulados: ${allTicks.length.toLocaleString()} / ${targetTicks.toLocaleString()} ticks`);

      if (allTicks.length >= targetTicks) {
        break;
      }

      currentEnd = times[0] - 1;
      await new Promise(r => setTimeout(r, 120)); // Respetar rate limit

    } catch (err) {
      log(`Aviso de red: ${err.message}. Reintentando...`, '#ef4444');
      await new Promise(r => setTimeout(r, 1000));
    }
  }

  finalizar(allTicks.length > 0);
}

// Fallback directo por WebSocket con emulación de cliente nativo
function pedirLoteWebSocket(symbol, end, count) {
  return new Promise((resolve) => {
    // Usamos el cluster frontend que no restringe subdominios Netlify
    const wsUrl = `wss://frontend.derivws.com/websockets/v3?app_id=1089`;
    let socket;
    try {
      socket = new WebSocket(wsUrl);
    } catch (e) {
      return resolve(null);
    }

    const timer = setTimeout(() => {
      try { socket.close(); } catch(e){}
      resolve(null);
    }, 8000);

    socket.onopen = () => {
      socket.send(JSON.stringify({
        ticks_history: symbol,
        adjust_start_time: 1,
        count: count,
        end: end,
        style: 'ticks'
      }));
    };

    socket.onmessage = (e) => {
      clearTimeout(timer);
      try {
        const res = JSON.parse(e.data);
        if (res.history && res.history.times) {
          socket.close();
          resolve(res.history);
        } else {
          socket.close();
          resolve(null);
        }
      } catch (err) {
        socket.close();
        resolve(null);
      }
    };

    socket.onerror = () => {
      clearTimeout(timer);
      resolve(null);
    };
  });
}

function detener() {
  if (!isRunning) return;
  log('Descarga detenida. Procesando datos...', '#f59e0b');
  isRunning = false;
  finalizar(allTicks.length > 0);
}

function finalizar(descargar) {
  isRunning = false;
  document.getElementById('btnStart').style.display = 'block';
  document.getElementById('btnStop').style.display = 'none';
  document.getElementById('assetSelect').disabled = false;
  document.getElementById('targetCount').disabled = false;
  setBadge('Completado');

  if (descargar && allTicks.length > 0) {
    if (allTicks.length > targetTicks) {
      allTicks = allTicks.slice(allTicks.length - targetTicks);
    }
    guardarArchivo();
  }
}

function guardarArchivo() {
  log(`Exportando ${allTicks.length.toLocaleString()} registros de ${selectedSymbol}...`, '#38bdf8');

  let csv = 'epoch,datetime_utc,symbol,price\n';
  for (let i = 0; i < allTicks.length; i++) {
    const t = allTicks[i];
    const iso = new Date(t.epoch * 1000).toISOString();
    csv += `${t.epoch},${iso},${selectedSymbol},${t.price}\n`;
  }

  const formato = document.querySelector('input[name="format"]:checked').value;
  const ts = Date.now();
  const filename = `deriv_${selectedSymbol}_${allTicks.length}k_${ts}`;

  if (formato === 'gz') {
    const compressed = pako.gzip(csv);
    const blob = new Blob([compressed], { type: 'application/gzip' });
    descargar(blob, `${filename}.csv.gz`);
  } else {
    const blob = new Blob([csv], { type: 'text/csv;charset=utf-8;' });
    descargar(blob, `${filename}.csv`);
  }

  log(`✔ Descarga finalizada en tu teléfono con éxito.`, '#4ade80');
}

function descargar(blob, filename) {
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url;
  a.download = filename;
  document.body.appendChild(a);
  a.click();
  document.body.removeChild(a);
  URL.revokeObjectURL(url);
}
</script>
</body>
</html>
