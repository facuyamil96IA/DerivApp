<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Extractor Universal de Ticks Deriv (Servidor Red 4)</title>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/pako/2.1.0/pako.min.js"></script>
  <style>
    * { box-sizing: border-box; }
    body {
      background: #090d16;
      color: #f1f5f9;
      font-family: system-ui, -apple-system, sans-serif;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      margin: 0;
      padding: 16px;
    }
    .card {
      background: #1e293b;
      padding: 24px;
      border-radius: 12px;
      width: 100%;
      max-width: 560px;
      box-shadow: 0 10px 30px rgba(0,0,0,0.6);
      border: 1px solid #334155;
    }
    h2 { margin: 0 0 6px 0; color: #38bdf8; font-size: 1.25rem; }
    p { color: #94a3b8; font-size: 0.82rem; margin: 0 0 16px 0; }
    .badge {
      display: inline-block;
      background: #064e3b;
      color: #34d399;
      font-size: 0.72rem;
      padding: 2px 8px;
      border-radius: 4px;
      margin-bottom: 14px;
      font-family: monospace;
    }
    .grid-2 {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 12px;
      margin-bottom: 14px;
    }
    label {
      display: block;
      font-size: 0.78rem;
      color: #cbd5e1;
      margin-bottom: 5px;
      font-weight: 600;
    }
    select, input[type="text"], input[type="number"] {
      width: 100%;
      background: #0f172a;
      border: 1px solid #334155;
      padding: 9px 12px;
      border-radius: 6px;
      color: #fff;
      font-size: 0.88rem;
      font-family: monospace;
    }
    select:focus, input:focus { outline: none; border-color: #38bdf8; }
    .options-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 10px;
      margin-bottom: 16px;
    }
    .opt-card {
      background: #0f172a;
      border: 1px solid #334155;
      padding: 10px;
      border-radius: 8px;
      font-size: 0.82rem;
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 8px;
    }
    .opt-card input { cursor: pointer; }
    .btn-row {
      display: flex;
      gap: 10px;
      margin-top: 6px;
    }
    button {
      flex: 1;
      background: #2563eb;
      color: white;
      border: none;
      padding: 12px;
      border-radius: 6px;
      font-size: 0.95rem;
      font-weight: 600;
      cursor: pointer;
      transition: background 0.2s;
    }
    button:hover { background: #1d4ed8; }
    button:disabled { background: #475569; cursor: not-allowed; }
    .btn-stop { background: #dc2626; }
    .btn-stop:hover { background: #b91c1c; }
    .progress-box {
      margin: 16px 0 6px 0;
      background: #0f172a;
      border-radius: 6px;
      height: 12px;
      overflow: hidden;
      border: 1px solid #334155;
    }
    .progress-bar { height: 100%; width: 0%; background: #38bdf8; transition: width 0.15s ease; }
    .stats-row {
      display: flex;
      justify-content: space-between;
      font-size: 0.78rem;
      color: #94a3b8;
      font-family: monospace;
      margin-bottom: 12px;
    }
    #console {
      background: #020617;
      border: 1px solid #334155;
      border-radius: 6px;
      padding: 12px;
      font-family: monospace;
      font-size: 0.75rem;
      height: 170px;
      overflow-y: auto;
      color: #a5f3fc;
    }
  </style>
</head>
<body>

<div class="card">
  <h2>Extractor Universal de Ticks Deriv</h2>
  <span class="badge">Endpoint: wss://red.derivws.com/websockets/v3 (Servidor 4)</span>
  <p>Descarga histórica paginada en reversa por lotes de 5.000 ticks.</p>

  <div class="grid-2">
    <div>
      <label for="assetSelect">Activo a extraer:</label>
      <select id="assetSelect" onchange="checkCustomAsset(this.value)">
        <optgroup label="Sintéticos Volatility (1s)">
          <option value="1HZ75V" selected>1HZ75V (Volatility 75 1s)</option>
          <option value="1HZ10V">1HZ10V (Volatility 10 1s)</option>
          <option value="1HZ25V">1HZ25V (Volatility 25 1s)</option>
          <option value="1HZ50V">1HZ50V (Volatility 50 1s)</option>
          <option value="1HZ100V">1HZ100V (Volatility 100 1s)</option>
          <option value="1HZ150V">1HZ150V (Volatility 150 1s)</option>
          <option value="1HZ250V">1HZ250V (Volatility 250 1s)</option>
        </optgroup>
        <optgroup label="Sintéticos Volatility Estándar (2s)">
          <option value="R_75">R_75 (Volatility 75)</option>
          <option value="R_10">R_10 (Volatility 10)</option>
          <option value="R_25">R_25 (Volatility 25)</option>
          <option value="R_50">R_50 (Volatility 50)</option>
          <option value="R_100">R_100 (Volatility 100)</option>
        </optgroup>
        <optgroup label="Crash / Boom">
          <option value="BOOM500">BOOM500</option>
          <option value="BOOM1000">BOOM1000</option>
          <option value="CRASH500">CRASH500</option>
          <option value="CRASH1000">CRASH1000</option>
        </optgroup>
        <optgroup label="Cripto / Forex">
          <option value="cryBTCUSD">cryBTCUSD (Bitcoin)</option>
          <option value="cryETHUSD">cryETHUSD (Ethereum)</option>
          <option value="frxEURUSD">frxEURUSD (EUR/USD)</option>
          <option value="frxGBPUSD">frxGBPUSD (GBP/USD)</option>
        </optgroup>
        <option value="CUSTOM">-- Escribir otro símbolo --</option>
      </select>
    </div>

    <div>
      <label for="targetCount">Cantidad de Ticks:</label>
      <input type="number" id="targetCount" value="100000" step="5000" min="5000" max="1000000">
    </div>
  </div>

  <div id="customSymbolRow" style="display: none; margin-bottom: 14px;">
    <label for="customSymbolInput">Símbolo manual (Código exacto de Deriv):</label>
    <input type="text" id="customSymbolInput" placeholder="Ej: 1HZ200V, STEPINDEX, etc.">
  </div>

  <div class="options-grid">
    <label class="opt-card">
      <input type="radio" name="format" value="csv" checked>
      <span>CSV Plano (.csv)</span>
    </label>
    <label class="opt-card">
      <input type="radio" name="format" value="gz">
      <span>Comprimido (.csv.gz)</span>
    </label>
  </div>

  <div class="btn-row">
    <button id="btnStart" onclick="iniciarExtraccion()">Iniciar Extracción</button>
    <button id="btnStop" class="btn-stop" onclick="detenerExtraccion()" style="display: none;">Detener y Descargar</button>
  </div>

  <div class="progress-box">
    <div id="bar" class="progress-bar"></div>
  </div>

  <div class="stats-row">
    <span id="statCount">Ticks: 0 / 100.000</span>
    <span id="statPct">0%</span>
  </div>

  <div id="console">> Selecciona el activo y presiona "Iniciar Extracción"...</div>
</div>

<script>
const WS_URL = 'wss://red.derivws.com/websockets/v3?app_id=1089';
const BATCH_SIZE = 5000;

let ws = null;
let allTicks = [];
let currentEnd = 'latest';
let isRunning = false;
let selectedSymbol = '1HZ75V';
let targetTicks = 100000;

function checkCustomAsset(val) {
  const row = document.getElementById('customSymbolRow');
  row.style.display = (val === 'CUSTOM') ? 'block' : 'none';
}

function getChosenSymbol() {
  const selectVal = document.getElementById('assetSelect').value;
  if (selectVal === 'CUSTOM') {
    return document.getElementById('customSymbolInput').value.trim().toUpperCase();
  }
  return selectVal;
}

function log(msg, color = '#a5f3fc') {
  const el = document.getElementById('console');
  const t = new Date().toTimeString().split(' ')[0];
  el.innerHTML += `<div style="color:${color}">[${t}] ${msg}</div>`;
  el.scrollTop = el.scrollHeight;
}

function updateProgress(count) {
  const pct = Math.min(100, Math.round((count / targetTicks) * 100));
  document.getElementById('bar').style.width = pct + '%';
  document.getElementById('statCount').innerText = `Ticks: ${count.toLocaleString()} / ${targetTicks.toLocaleString()}`;
  document.getElementById('statPct').innerText = `${pct}%`;
}

function iniciarExtraccion() {
  if (isRunning) return;

  selectedSymbol = getChosenSymbol();
  if (!selectedSymbol) {
    alert('Por favor ingresa o selecciona un activo válido.');
    return;
  }

  targetTicks = parseInt(document.getElementById('targetCount').value, 10) || 100000;
  if (targetTicks < 5000) {
    alert('La cantidad mínima es de 5.000 ticks.');
    return;
  }

  isRunning = true;
  allTicks = [];
  currentEnd = 'latest';
  updateProgress(0);

  // UI state
  document.getElementById('btnStart').style.display = 'none';
  document.getElementById('btnStop').style.display = 'block';
  document.getElementById('assetSelect').disabled = true;
  document.getElementById('targetCount').disabled = true;

  log(`Conectando a Deriv (Servidor Red 4) para extraer ${targetTicks.toLocaleString()} ticks de ${selectedSymbol}...`, '#38bdf8');

  try {
    ws = new WebSocket(WS_URL);
  } catch (e) {
    log(`Error inicializando WebSocket: ${e.message}`, '#ef4444');
    finalizar(false);
    return;
  }

  ws.onopen = () => {
    log(`Conexión exitosa. Solicitando primer lote de ${selectedSymbol}...`, '#4ade80');
    solicitarLote();
  };

  ws.onmessage = (event) => {
    if (!isRunning) return;

    const data = JSON.parse(event.data);

    if (data.error) {
      log(`Error devuelto por Deriv: ${data.error.message}`, '#ef4444');
      finalizar(allTicks.length > 0);
      return;
    }

    if (data.msg_type === 'history') {
      const times = data.history.times || [];
      const prices = data.history.prices || [];

      if (!times.length) {
        log('Fin del historial disponible en los servidores de Deriv.', '#facc15');
        finalizar(true);
        return;
      }

      // Concatenar al frente para mantener el orden cronológico antiguo -> reciente
      const batch = times.map((t, i) => ({ epoch: t, price: prices[i] }));
      allTicks = batch.concat(allTicks);

      updateProgress(allTicks.length);
      log(`Descargados: ${allTicks.length.toLocaleString()} / ${targetTicks.toLocaleString()} ticks (Lote de ${times.length})`);

      if (allTicks.length >= targetTicks) {
        allTicks = allTicks.slice(allTicks.length - targetTicks);
        finalizar(true);
      } else {
        // Retroceder un segundo antes del tick más antiguo recibido en el lote
        currentEnd = times[0] - 1;
        setTimeout(solicitarLote, 130); // Pausa para respetar el rate limit
      }
    }
  };

  ws.onerror = () => {
    log('Fallo de red en el WebSocket.', '#ef4444');
    finalizar(allTicks.length > 0);
  };

  ws.onclose = () => {
    if (isRunning) {
      log('Conexión cerrada prematuramente por el servidor.', '#f87171');
      finalizar(allTicks.length > 0);
    }
  };
}

function solicitarLote() {
  if (!ws || ws.readyState !== WebSocket.OPEN || !isRunning) return;
  ws.send(JSON.stringify({
    ticks_history: selectedSymbol,
    adjust_start_time: 1,
    count: BATCH_SIZE,
    end: currentEnd,
    style: 'ticks'
  }));
}

function detenerExtraccion() {
  if (!isRunning) return;
  log('Detención solicitada por el usuario. Procesando ticks capturados...', '#f59e0b');
  finalizar(allTicks.length > 0);
}

function finalizar(generarDescarga) {
  isRunning = false;
  document.getElementById('btnStart').style.display = 'block';
  document.getElementById('btnStop').style.display = 'none';
  document.getElementById('assetSelect').disabled = false;
  document.getElementById('targetCount').disabled = false;

  if (ws) {
    try { ws.close(); } catch(e){}
  }

  if (generarDescarga && allTicks.length > 0) {
    generarArchivo();
  } else {
    log('Proceso concluido sin descarga.', '#94a3b8');
  }
}

function generarArchivo() {
  log(`Generando CSV con ${allTicks.length.toLocaleString()} ticks de ${selectedSymbol}...`, '#38bdf8');

  let csv = 'epoch,datetime_utc,symbol,price\n';
  for (let i = 0; i < allTicks.length; i++) {
    const t = allTicks[i];
    const iso = new Date(t.epoch * 1000).toISOString();
    csv += `${t.epoch},${iso},${selectedSymbol},${t.price}\n`;
  }

  const formato = document.querySelector('input[name="format"]:checked').value;
  const ts = Date.now();
  const filename = `deriv_${selectedSymbol}_${allTicks.length}k_${ts}`;

  if (formato === 'gz') {
    log('Comprimiendo con Gzip (.csv.gz)...', '#38bdf8');
    const compressed = pako.gzip(csv);
    const blob = new Blob([compressed], { type: 'application/gzip' });
    descargarBlob(blob, `${filename}.csv.gz`);
  } else {
    log('Preparando descarga de CSV plano...', '#38bdf8');
    const blob = new Blob([csv], { type: 'text/csv;charset=utf-8;' });
    descargarBlob(blob, `${filename}.csv`);
  }

  log(`✔ ¡Descarga completada con éxito! (${allTicks.length.toLocaleString()} registros)`, '#4ade80');
}

function descargarBlob(blob, filename) {
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url;
  a.download = filename;
  document.body.appendChild(a);
  a.click();
  document.body.removeChild(a);
  URL.revokeObjectURL(url);
}
</script>
</body>
</html>
