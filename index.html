<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <title>Extractor Deriv V75 (1s)</title>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/pako/2.1.0/pako.min.js"></script>
  <style>
    * { box-sizing: border-box; }
    body {
      background: #090d16;
      color: #f1f5f9;
      font-family: system-ui, -apple-system, sans-serif;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      margin: 0;
      padding: 16px;
    }
    .card {
      background: #1e293b;
      padding: 24px;
      border-radius: 12px;
      width: 100%;
      max-width: 500px;
      box-shadow: 0 10px 30px rgba(0,0,0,0.6);
      border: 1px solid #334155;
    }
    h2 { margin-top: 0; color: #38bdf8; font-size: 1.2rem; }
    p { color: #94a3b8; font-size: 0.85rem; margin-bottom: 1rem; }
    input {
      width: 100%;
      background: #0f172a;
      border: 1px solid #334155;
      padding: 10px;
      border-radius: 6px;
      color: #fff;
      font-size: 0.9rem;
      margin-bottom: 12px;
    }
    button {
      background: #2563eb;
      color: white;
      border: none;
      padding: 12px;
      border-radius: 6px;
      font-size: 1rem;
      font-weight: 600;
      cursor: pointer;
      width: 100%;
    }
    button:disabled { background: #475569; cursor: not-allowed; }
    .progress-box {
      margin: 14px 0;
      background: #0f172a;
      border-radius: 6px;
      height: 10px;
      overflow: hidden;
      border: 1px solid #334155;
    }
    .progress-bar { height: 100%; width: 0%; background: #38bdf8; transition: width 0.2s; }
    #console {
      background: #020617;
      border: 1px solid #334155;
      border-radius: 6px;
      padding: 12px;
      font-family: monospace;
      font-size: 0.8rem;
      height: 180px;
      overflow-y: auto;
      color: #a5f3fc;
    }
  </style>
</head>
<body>

<div class="card">
  <h2>Extractor V75 (1s) - 100k Ticks</h2>
  <p>Pega el código obtenido de Deriv.</p>

  <input type="text" id="credential" value="34sXT58c5CvohLOUewrMU" />
  <button id="btn" onclick="iniciar()">Iniciar Extracción</button>

  <div class="progress-box">
    <div id="bar" class="progress-bar"></div>
  </div>

  <div id="console">> Presiona Iniciar para conectar...</div>
</div>

<script>
const SYMBOL = '1HZ75V';
const TARGET = 100000;
const BATCH = 5000;

let ws = null;
let allTicks = [];
let currentEnd = 'latest';

function log(msg, color = '#a5f3fc') {
  const el = document.getElementById('console');
  el.innerHTML += `<div style="color:${color}">> ${msg}</div>`;
  el.scrollTop = el.scrollHeight;
}

function updateProgress(count) {
  const pct = Math.min(100, Math.round((count / TARGET) * 100));
  document.getElementById('bar').style.width = pct + '%';
}

function iniciar() {
  const val = document.getElementById('credential').value.trim();
  if (!val) {
    alert('Ingresa la credencial.');
    return;
  }

  document.getElementById('btn').disabled = true;
  allTicks = [];
  currentEnd = 'latest';

  // Usamos el endpoint base universal
  const url = `wss://ws.derivws.com/websockets/v3?app_id=1089`;
  log('Abriendo socket...');
  
  ws = new WebSocket(url);

  ws.onopen = () => {
    log('Socket abierto. Verificando credencial en Deriv...');
    // Intentamos autorizar primero con el valor ingresado
    ws.send(JSON.stringify({ authorize: val }));
  };

  ws.onmessage = (event) => {
    const data = JSON.parse(event.data);

    // Si authorize responde con éxito
    if (data.msg_type === 'authorize') {
      log('¡Credencial verificada con éxito!', '#4ade80');
      log('Comenzando recolección de ticks...');
      pedirLote();
      return;
    }

    // Si falló authorize (porque era un ID y no un token), pedimos directo sin auth
    if (data.error && data.echo_req && data.echo_req.authorize) {
      log('Aviso: Procesando como ID de lectura pública...', '#facc15');
      pedirLote();
      return;
    }

    if (data.error) {
      log(`Error Deriv: ${data.error.message}`, '#f87171');
      cerrar();
      return;
    }

    if (data.msg_type === 'history') {
      const times = data.history.times || [];
      const prices = data.history.prices || [];

      if (!times.length) {
        log('Fin del historial disponible.', '#facc15');
        descargar();
        return;
      }

      const batch = times.map((t, i) => ({ epoch: t, price: prices[i] }));
      allTicks = batch.concat(allTicks);

      updateProgress(allTicks.length);
      log(`Descargados: ${allTicks.length.toLocaleString()} / ${TARGET.toLocaleString()} ticks`);

      if (allTicks.length >= TARGET) {
        allTicks = allTicks.slice(allTicks.length - TARGET);
        descargar();
      } else {
        currentEnd = times[0] - 1;
        setTimeout(pedirLote, 150);
      }
    }
  };

  ws.onerror = () => {
    log('Fallo de red en el WebSocket.', '#ef4444');
    cerrar();
  };
}

function pedirLote() {
  ws.send(JSON.stringify({
    ticks_history: SYMBOL,
    adjust_start_time: 1,
    count: BATCH,
    end: currentEnd,
    style: 'ticks'
  }));
}

function cerrar() {
  document.getElementById('btn').disabled = false;
  if (ws) ws.close();
}

function descargar() {
  log('Comprimiendo datos en .csv.gz...');
  let csv = 'epoch,datetime_utc,price\n';
  for (let i = 0; i < allTicks.length; i++) {
    const t = allTicks[i];
    csv += `${t.epoch},${new Date(t.epoch * 1000).toISOString()},${t.price}\n`;
  }

  const compressed = pako.gzip(csv);
  const blob = new Blob([compressed], { type: 'application/gzip' });
  const url = URL.createObjectURL(blob);

  const a = document.createElement('a');
  a.href = url;
  a.download = `deriv_1HZ75V_100k_${Date.now()}.csv.gz`;
  document.body.appendChild(a);
  a.click();
  document.body.removeChild(a);
  URL.revokeObjectURL(url);

  log('¡Archivo descargado con éxito!', '#4ade80');
  cerrar();
}
</script>
</body>
</html>
