<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Deriv - Mis Cuentas</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: #0a0e17;
            color: #e2e8f0;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            padding: 40px 20px;
        }
        .container { width: 100%; max-width: 720px; }
        h1 {
            font-size: 1.6rem;
            margin-bottom: 8px;
            color: #fff;
        }
        .subtitle {
            color: #8892b0;
            font-size: 0.9rem;
            margin-bottom: 28px;
        }
        .card {
            background: #111827;
            border: 1px solid #1e293b;
            border-radius: 12px;
            padding: 24px;
            margin-bottom: 20px;
        }
        label {
            display: block;
            font-size: 0.8rem;
            font-weight: 600;
            color: #94a3b8;
            margin-bottom: 6px;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }
        input {
            width: 100%;
            padding: 12px 14px;
            background: #0a0e17;
            border: 1px solid #1e293b;
            border-radius: 8px;
            color: #e2e8f0;
            font-size: 0.9rem;
            font-family: 'SF Mono', monospace;
            margin-bottom: 16px;
            transition: border-color 0.2s;
        }
        input:focus { outline: none; border-color: #38bdf8; }
        button {
            width: 100%;
            padding: 12px;
            background: #38bdf8;
            color: #0a0e17;
            border: none;
            border-radius: 8px;
            font-size: 0.95rem;
            font-weight: 700;
            cursor: pointer;
            transition: background 0.2s;
        }
        button:hover { background: #7dd3fc; }
        button:disabled { opacity: 0.5; cursor: not-allowed; }
        .status {
            margin-top: 16px;
            padding: 12px 14px;
            border-radius: 8px;
            font-size: 0.85rem;
            display: none;
        }
        .status.error { background: #450a0a; color: #fca5a5; border: 1px solid #7f1d1d; }
        .status.success { background: #052e16; color: #86efac; border: 1px solid #166534; }
        .status.info { background: #0c2d48; color: #7dd3fc; border: 1px solid #1e3a5f; }
        table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 8px;
        }
        th {
            text-align: left;
            font-size: 0.75rem;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            color: #64748b;
            padding: 10px 12px;
            border-bottom: 1px solid #1e293b;
        }
        td {
            padding: 12px;
            font-size: 0.88rem;
            border-bottom: 1px solid #1e293b;
            font-family: 'SF Mono', monospace;
        }
        tr:last-child td { border-bottom: none; }
        .badge {
            display: inline-block;
            padding: 2px 8px;
            border-radius: 4px;
            font-size: 0.75rem;
            font-weight: 600;
        }
        .badge.real { background: #14532d; color: #86efac; }
        .badge.demo { background: #1e3a5f; color: #93c5fd; }
        .badge.active { background: #052e16; color: #86efac; }
        .badge.inactive { background: #450a0a; color: #fca5a5; }
        .account-id {
            color: #38bdf8;
            font-weight: 600;
        }
        .empty { color: #64748b; text-align: center; padding: 20px; }
        .balance-col { color: #fbbf24; font-weight: 600; }
    </style>
</head>
<body>
<div class="container">
    <h1>📊 Deriv — Mis Cuentas</h1>
    <p class="subtitle">Lista tus IDs de cuentas (Demo y Real) vía API REST</p>

    <div class="card">
        <label for="token">Personal Access Token (PAT)</label>
        <input type="password" id="token" placeholder="pat_..." autocomplete="off">

        <label for="appId">Deriv-App-ID</label>
        <input type="text" id="appId" value="34sXT58c5CvohLOUewrMU" autocomplete="off">

        <button id="fetchBtn">🔍 Obtener mis cuentas</button>
        <div id="status" class="status"></div>
    </div>

    <div class="card" id="resultsCard" style="display:none;">
        <table id="resultsTable">
            <thead>
                <tr>
                    <th>Account ID</th>
                    <th>Tipo</th>
                    <th>Moneda</th>
                    <th>Balance</th>
                    <th>Estado</th>
                </tr>
            </thead>
            <tbody id="resultsBody"></tbody>
        </table>
    </div>
</div>

<script>
    const API_URL = 'https://api.derivws.com/trading/v1/options/accounts';

    const tokenInput = document.getElementById('token');
    const appIdInput = document.getElementById('appId');
    const fetchBtn = document.getElementById('fetchBtn');
    const statusEl = document.getElementById('status');
    const resultsCard = document.getElementById('resultsCard');
    const resultsBody = document.getElementById('resultsBody');

    function showStatus(msg, type) {
        statusEl.textContent = msg;
        statusEl.className = 'status ' + type;
        statusEl.style.display = 'block';
    }

    function hideStatus() {
        statusEl.style.display = 'none';
    }

    function renderAccounts(accounts) {
        resultsBody.innerHTML = '';
        if (!accounts || accounts.length === 0) {
            resultsBody.innerHTML = '<tr><td colspan="5" class="empty">No se encontraron cuentas.</td></tr>';
            resultsCard.style.display = 'block';
            return;
        }

        accounts.forEach(acc => {
            const tr = document.createElement('tr');

            const id = acc.account_id || acc.loginid || '—';
            const type = (acc.account_type || '').toLowerCase();
            const currency = acc.currency || '—';
            const balance = acc.balance !== undefined ? Number(acc.balance).toFixed(2) : '—';
            const status = acc.status || acc.account_status || '—';

            const typeClass = type.includes('demo') ? 'demo' : 'real';
            const statusClass = status.toLowerCase().includes('active') || status === 'active' ? 'active' : 'inactive';

            tr.innerHTML = `
                <td class="account-id">${id}</td>
                <td><span class="badge ${typeClass}">${type || '—'}</span></td>
                <td>${currency}</td>
                <td class="balance-col">${balance}</td>
                <td><span class="badge ${statusClass}">${status}</span></td>
            `;
            resultsBody.appendChild(tr);
        });

        resultsCard.style.display = 'block';
    }

    async function fetchAccounts() {
        const token = tokenInput.value.trim();
        const appId = appIdInput.value.trim();

        if (!token) {
            showStatus('⚠️ Ingresa tu Personal Access Token (PAT).', 'error');
            return;
        }
        if (!appId) {
            showStatus('⚠️ El Deriv-App-ID es obligatorio para autenticación PAT.', 'error');
            return;
        }

        hideStatus();
        fetchBtn.disabled = true;
        fetchBtn.textContent = '⏳ Consultando...';
        resultsCard.style.display = 'none';

        try {
            const res = await fetch(API_URL, {
                method: 'GET',
                headers: {
                    'Authorization': `Bearer ${token}`,
                    'Deriv-App-ID': appId,
                    'Content-Type': 'application/json'
                }
            });

            const data = await res.json();

            if (!res.ok) {
                const errMsg = data?.error?.message || data?.message || `Error HTTP ${res.status}`;
                showStatus(`❌ ${errMsg}`, 'error');
                return;
            }

            // La respuesta puede venir como array directo o dentro de data
            const accounts = Array.isArray(data) ? data : (data.data || data.accounts || []);

            if (accounts.length === 0) {
                showStatus('ℹ️ No se encontraron cuentas asociadas a este token.', 'info');
            } else {
                showStatus(`✅ ${accounts.length} cuenta(s) encontrada(s).`, 'success');
            }
            renderAccounts(accounts);

        } catch (err) {
            showStatus(`❌ Error de conexión: ${err.message}`, 'error');
        } finally {
            fetchBtn.disabled = false;
            fetchBtn.textContent = '🔍 Obtener mis cuentas';
        }
    }

    fetchBtn.addEventListener('click', fetchAccounts);
    tokenInput.addEventListener('keydown', e => { if (e.key === 'Enter') fetchAccounts(); });
</script>
</body>
</html>
