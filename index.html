<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Extractor Deriv V75 (1s) - 100k Ticks</title>
  <!-- Librería ligera para compresión gzip cliente -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/pako/2.1.0/pako.min.js"></script>
  <style>
    * { box-sizing: border-box; }
    body {
      background: #090d16;
      color: #f1f5f9;
      font-family: system-ui, -apple-system, sans-serif;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      margin: 0;
      padding: 16px;
    }
    .card {
      background: #1e293b;
      padding: 24px;
      border-radius: 12px;
      width: 100%;
      max-width: 520px;
      box-shadow: 0 10px 30px rgba(0,0,0,0.6);
      border: 1px solid #334155;
    }
    h2 { margin: 0 0 8px 0; color: #38bdf8; font-size: 1.25rem; }
    p { color: #94a3b8; font-size: 0.85rem; margin: 0 0 16px 0; }
    .badge {
      display: inline-block;
      background: #064e3b;
      color: #34d399;
      font-size: 0.75rem;
      padding: 2px 8px;
      border-radius: 4px;
      margin-bottom: 12px;
    }
    .options-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 10px;
      margin-bottom: 16px;
    }
    .opt-card {
      background: #0f172a;
      border: 1px solid #334155;
      padding: 10px;
      border-radius: 8px;
      font-size: 0.85rem;
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 8px;
    }
    .opt-card input { cursor: pointer; }
    button {
      background: #2563eb;
      color: white;
      border: none;
      padding: 12px;
      border-radius: 6px;
      font-size: 1rem;
      font-weight: 600;
      cursor: pointer;
      width: 100%;
      transition: background 0.2s;
    }
    button:hover { background: #1d4ed8; }
    button:disabled { background: #475569; cursor: not-allowed; }
    .progress-box {
      margin: 16px 0 8px 0;
      background: #0f172a;
      border-radius: 6px;
      height: 12px;
      overflow: hidden;
      border: 1px solid #334155;
    }
    .progress-bar { height: 100%; width: 0%; background: #38bdf8; transition: width 0.2s ease; }
    .stats-row {
      display: flex;
      justify-content: space-between;
      font-size: 0.8rem;
      color: #94a3b8;
      margin-bottom: 12px;
    }
    #console {
      background: #020617;
      border: 1px solid #334155;
      border-radius: 6px;
      padding: 12px;
      font-family: monospace;
      font-size: 0.78rem;
      height: 180px;
      overflow-y: auto;
      color: #a5f3fc;
    }
  </style>
</head>
<body>

<div class="card">
  <h2>Extractor V75 (1s) - 100.000 Ticks</h2>
  <span class="badge">Conexión fijada: Servidor Red (4) sin bloqueo ISP</span>
  <p>Descarga el historial completo de <code>1HZ75V</code> listo para análisis cuantitativo.</p>

  <div class="options-grid">
    <label class="opt-card">
      <input type="radio" name="format" value="csv" checked>
      <span>CSV Plano (.csv)</span>
    </label>
    <label class="opt-card">
      <input type="radio" name="format" value="gz">
      <span>Comprimido (.csv.gz)</span>
    </label>
  </div>

  <button id="btnStart" onclick="iniciarExtraccion()">Iniciar Extracción (100k Ticks)</button>

  <div class="progress-box">
    <div id="bar" class="progress-bar"></div>
  </div>
  
  <div class="stats-row">
    <span id="statCount">Ticks: 0 / 100.000</span>
    <span id="statPct">0%</span>
  </div>

  <div id="console">> Presiona "Iniciar Extracción" para conectar con Deriv...</div>
</div>

<script>
const SYMBOL = '1HZ75V';
const TARGET = 100000;
const BATCH = 5000;

// Servidor 4 configurado como primario
const PRIMARY_WS = 'wss://red.derivws.com/websockets/v3?app_id=1089';

let ws = null;
let allTicks = [];
let currentEnd = 'latest';
let isRunning = false;

function log(msg, color = '#a5f3fc') {
  const el = document.getElementById('console');
  el.innerHTML += `<div style="color:${color}">> ${msg}</div>`;
  el.scrollTop = el.scrollHeight;
}

function updateProgress(count) {
  const pct = Math.min(100, Math.round((count / TARGET) * 100));
  document.getElementById('bar').style.width = pct + '%';
  document.getElementById('statCount').innerText = `Ticks: ${count.toLocaleString()} / ${TARGET.toLocaleString()}`;
  document.getElementById('statPct').innerText = `${pct}%`;
}

function iniciarExtraccion() {
  if (isRunning) return;
  isRunning = true;

  document.getElementById('btnStart').disabled = true;
  allTicks = [];
  currentEnd = 'latest';
  updateProgress(0);

  log(`Conectando al servidor Red de Deriv...`);

  try {
    ws = new WebSocket(PRIMARY_WS);
  } catch (e) {
    log('Fallo de inicialización WebSocket.', '#ef4444');
    detener();
    return;
  }

  ws.onopen = () => {
    log('¡Conectado exitosamente! Solicitando primer lote...', '#4ade80');
    pedirLote();
  };

  ws.onmessage = (event) => {
    const data = JSON.parse(event.data);

    if (data.error) {
      log(`Error devuelto por Deriv: ${data.error.message}`, '#f87171');
      detener();
      return;
    }

    if (data.msg_type === 'history') {
      const times = data.history.times || [];
      const prices = data.history.prices || [];

      if (!times.length) {
        log('Fin de datos históricos disponibles.', '#facc15');
        generarArchivo();
        return;
      }

      // Estructuramos el bloque y lo concatenamos al frente (orden cronológico)
      const batch = times.map((t, i) => ({ epoch: t, price: prices[i] }));
      allTicks = batch.concat(allTicks);

      updateProgress(allTicks.length);
      log(`Descargados: ${allTicks.length.toLocaleString()} / ${TARGET.toLocaleString()} ticks`);

      if (allTicks.length >= TARGET) {
        allTicks = allTicks.slice(allTicks.length - TARGET);
        generarArchivo();
      } else {
        // Paginamos hacia atrás: un segundo antes del tick más antiguo recibido
        currentEnd = times[0] - 1;
        setTimeout(pedirLote, 130);
      }
    }
  };

  ws.onerror = (err) => {
    log('Fallo de red en el WebSocket del Servidor 4.', '#ef4444');
    detener();
  };
}

function pedirLote() {
  if (!ws || ws.readyState !== WebSocket.OPEN) return;
  ws.send(JSON.stringify({
    ticks_history: SYMBOL,
    adjust_start_time: 1,
    count: BATCH,
    end: currentEnd,
    style: 'ticks'
  }));
}

function detener() {
  isRunning = false;
  document.getElementById('btnStart').disabled = false;
  if (ws) {
    try { ws.close(); } catch(e){}
  }
}

function generarArchivo() {
  log('Generando estructura CSV...', '#38bdf8');

  let csv = 'epoch,datetime_utc,price\n';
  for (let i = 0; i < allTicks.length; i++) {
    const t = allTicks[i];
    const iso = new Date(t.epoch * 1000).toISOString();
    csv += `${t.epoch},${iso},${t.price}\n`;
  }

  const formato = document.querySelector('input[name="format"]:checked').value;
  const ts = Date.now();

  if (formato === 'gz') {
    log('Comprimiendo en gzip (.csv.gz)...', '#38bdf8');
    const compressed = pako.gzip(csv);
    const blob = new Blob([compressed], { type: 'application/gzip' });
    descargarBlob(blob, `deriv_1HZ75V_100k_${ts}.csv.gz`);
  } else {
    log('Preparando descarga directa (.csv)...', '#38bdf8');
    const blob = new Blob([csv], { type: 'text/csv;charset=utf-8;' });
    descargarBlob(blob, `deriv_1HZ75V_100k_${ts}.csv`);
  }

  log('¡Descarga completada con éxito! Sube el archivo aquí.', '#4ade80');
  detener();
}

function descargarBlob(blob, filename) {
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url;
  a.download = filename;
  document.body.appendChild(a);
  a.click();
  document.body.removeChild(a);
  URL.revokeObjectURL(url);
}
</script>
</body>
</html>
